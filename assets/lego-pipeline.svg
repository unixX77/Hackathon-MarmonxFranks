<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 460" role="img" aria-labelledby="title desc">
<title id="title">LEGO perception pipeline</title><desc id="desc">RGB-D input branches into SAM 3 segmentation and depth processing; top-plane selection and lattice reconstruction generate individual boxes, which feed quality classification and camera-frame pose estimation before robot handoff.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6888aa"/></marker><style>text{font-family:'Google Sans','Noto Sans',Arial,sans-serif;fill:#39495b}.head{font-size:19px;font-weight:700}.small{font-size:15px;fill:#5e7084}.tag{font-size:12px;letter-spacing:1.8px;font-weight:700;fill:#1966bd}.box{fill:white;stroke:#d3dfed;stroke-width:2}.line{fill:none;stroke:#6888aa;stroke-width:2.5;marker-end:url(#a)}</style></defs>
<rect width="1440" height="460" rx="16" fill="#f9fbfe"/>
<rect x="25" y="154" width="178" height="146" rx="12" class="box"/><text x="44" y="185" class="tag">01 · INPUT</text><text x="44" y="220" class="head">RGB-D camera</text><text x="44" y="246" class="small">Aligned color + depth</text><text x="44" y="270" class="small">Camera intrinsics</text>
<rect x="263" y="44" width="240" height="116" rx="12" class="box"/><text x="282" y="75" class="tag">02A · APPEARANCE</text><text x="282" y="108" class="head">SAM 3 segmentation</text><text x="282" y="134" class="small">LEGO-shaped seed masks</text>
<rect x="263" y="296" width="240" height="116" rx="12" class="box"/><text x="282" y="327" class="tag">02B · GEOMETRY</text><text x="282" y="360" class="head">Depth + support plane</text><text x="282" y="386" class="small">Denoise and measure height</text>
<rect x="565" y="144" width="266" height="166" rx="12" fill="#ecf5ff" stroke="#a9cbe9" stroke-width="2"/><text x="584" y="175" class="tag">03 · TOP-LAYER INSTANCES</text><text x="584" y="208" class="head">Plane + LEGO lattice</text><text x="584" y="235" class="small">Select exposed top surface</text><text x="584" y="258" class="small">Recover candidate brick cells</text><text x="584" y="281" class="small">Validate oriented boxes</text>
<rect x="897" y="44" width="235" height="116" rx="12" class="box"/><text x="916" y="75" class="tag">04A · CLASSIFICATION</text><text x="916" y="108" class="head">Color quality</text><text x="916" y="134" class="small">Corrected Lab → good / bad</text>
<rect x="897" y="296" width="235" height="116" rx="12" class="box"/><text x="916" y="327" class="tag">04B · POSE</text><text x="916" y="360" class="head">3D camera geometry</text><text x="916" y="386" class="small">Center, axes and box corners</text>
<rect x="1195" y="154" width="220" height="146" rx="12" fill="#f4faf6" stroke="#bfdcc8" stroke-width="2"/><text x="1214" y="185" class="tag">05 · HANDOFF</text><text x="1214" y="220" class="head">Robotics team</text><text x="1214" y="246" class="small">Camera → robot transform</text><text x="1214" y="270" class="small">Plan, grasp and sort</text>
<path d="M203 205 H230 V102 H260" class="line"/><path d="M203 250 H230 V354 H260" class="line"/><path d="M503 102 H534 V190 H562" class="line"/><path d="M503 354 H534 V263 H562" class="line"/><path d="M831 190 H861 V102 H894" class="line"/><path d="M831 263 H861 V354 H894" class="line"/><path d="M1132 102 H1162 V205 H1192" class="line"/><path d="M1132 354 H1162 V250 H1192" class="line"/>
</svg>
