# Pose-driven pick (pose_pick.py). No camera, no calibration. Lengths in metres, in fr3_link0.
base_frame: fr3_link0
ee_frame: fr3_hand_tcp

# ---- Brick (CHECK against the real brick) ----------------------------------------------
# [long side, short side, height] excluding studs. The jaws close across the SHORT side.
block_size: [0.032, 0.016, 0.0096]

# ---- Table ------------------------------------------------------------------------------
# Robot base sits 2 cm above the table surface, so the surface is at z = -0.02 in fr3_link0.
table_top_z: -0.02
table_center: [0.35, 0.0, -0.05]
table_size: [1.60, 1.20, 0.06]

# ---- Poses that will be accepted (a pose outside is refused before anything moves) -------
workspace_x: [0.25, 0.60]
workspace_y: [-0.30, 0.30]
max_hover_z: 0.55               # highest the hand may go while hovering above the brick

# ---- Grasp ------------------------------------------------------------------------------
# TCP height above the table at the grasp. The fingertip ends are ~9 mm below the TCP, so a
# TCP lower than ~10 mm above the table would put them in the table.
grasp_tcp_height: 0.012
min_tcp_above_table: 0.010
clearance: 0.10                 # hover / lift height above the grasp
place_margin: 0.002             # --place: the hand stops this far above the height the brick rests at before letting go
# ---- Hand widths (total opening between the fingertips), used for EVERY open and close --------
# Other bricks stand right next to the pick spot, so the hand only opens a hair wider than the brick
# (short side 16 mm): open 18 mm, close 15 mm. Change them here, not on the command line.
grasp_width: 0.015              # close to this on the brick (the real hand checks it closed on something)
open_width: 0.018               # open to this: 1 mm per side around a 16 mm brick, so the hand must be
                                # lined up to about 1 mm sideways and in yaw, or a finger lands on the brick
min_open_clearance: 0.001       # smallest open_width - brick short side the config check accepts (default 5 mm)

# ---- Grasp centring ---------------------------------------------------------------------------------
# The real middle between the fingertips can sit a little off the point the arm is told to go to. That
# shows up as a grasp slightly off the centre of the brick, while placing stays right (the same offset
# is in the arm at the place). This value is added to EVERY commanded hand position, pick and place.
# Metres, in the HAND frame: [along the brick's long side, across it (the way the jaws close)].
# At hand yaw 0: along = base +x (away from the robot), across = base -y. Do not guess it: measure it
# with  python3 src/fr3_pose_pick/scripts/measure_grasp_offset.py  (see the README), which prints this line.
tcp_correction_hand: [0.0, 0.0]
grasp_force: 10.0
gripper_speed: 0.02
velocity_scale: 0.05
acceleration_scale: 0.05
sim_speed_scale: 0.1            # fake hardware only

# ---- Reliability limits (pose_pick.py refuses instead of improvising) --------------------
max_tilt_deg: 20                # the hand must already point down within this angle at the start
max_joint_swing: 1.5            # refuse any single straight-line move that turns one of joints 1-6 more (rad)
max_wrist_swing: 2.2            # joint 7 (wrist) may turn more: a 90 degree hand yaw is already ~1.6 rad
inspect_height: 0.04            # stop this far above the grasp height so you can check the offset
max_nudge_step: 0.010           # one correction: at most 10 mm ...
max_nudge_yaw_step_deg: 15      # ... or 15 degrees
max_total_nudge: 0.030          # total x/y correction allowed per run (m)
arrival_warn: 0.003             # after each move: warn when the hand is further than this from the target
arrival_abort: 0.010            # ... and stop when it is further than this
offsets_log: pose_pick_offsets.json   # every run's measured correction is appended here

# ---- Camera-frame input (--camera-xyz): the hand-eye matrix -----------------------------
camera_frame: camera_color_optical_frame
# Hand-eye result (parent fr3_hand_tcp, child camera_color_optical_frame; T_ee_camera). It missed the
# strict 5 mm / 1 deg worst-case gate (typical error about 3 mm / 0.9 deg over 15 views); using it is a
# decision, recorded here. Path is relative to the repo root: run commands from there.
calibration_file: data/calibration/charuco_result.json
allow_rejected_calibration: true
table_check_tolerance: 0.008    # refuse when the converted top face is further than this from the table model
# Height of a camera point is worked out automatically (brick on the table, on other bricks, or on anything):
# the measured top face minus camera_height_bias, snapped to the exact height of the nearest brick layer when
# within layer_snap_tolerance of one, else used as measured. Bias: in your real runs the converted top face of a
# brick lying on the table came out 0.7 to 7.1 mm too high, 3.7 mm on average over 8 runs (spread 1.8 mm), partly
# the studs (about 1.7 mm). Re-measure it with a few picks of a brick on the table if the camera setup changes.
camera_height_bias: 0.0037
layer_snap_tolerance: 0.003     # within this of a whole layer (m): use the exact layer height
max_brick_top_above_table: 0.12 # a top face higher than this above the table is refused (m)
max_nudge_z_step: 0.005         # one z correction at the inspection stop: at most 5 mm ...
max_total_nudge_z: 0.015        # ... and 15 mm in total

# ---- Base pad: the 2 cm spacer between the robot base and the table -----------------------
# Footprint = the FR3 base (link0 collision mesh): 0.223 m long (x) by 0.188 m wide (y), so the
# box centre is not at the base origin in x. Top face at z=0 (underside of the base), bottom
# face at z=-0.02 = table_top_z. Delete both lines to remove it.
base_pad_size: [0.223, 0.188, 0.020]
base_pad_center: [-0.0414, 0.0, -0.010]
