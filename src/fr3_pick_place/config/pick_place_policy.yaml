# Combined-cycle policy. Other options use Policy defaults from pick_core.py.
ik_attempts: 8
max_candidates: 4
corrections: 2
descent_retries: 1

# The factor-2 relative heuristic truncated otherwise valid lift paths in the
# fake-stack diagnostic (largest observed joint step <0.011 rad). This factor
# remains enabled at 10. The independent absolute 0.1 rad Cartesian jump limit,
# dense timed-spline corridor/collision checks and singularity filters remain.
relative_jump_factor: 10.0

joint_margin_rad: 0.03
min_sigma: 0.025
jacobian_length_m: 0.3
max_joint_travel_rad: 2.5
correction_xyz_m: 0.005
correction_angle_deg: 1.0
monitor_xy_m: 0.003
monitor_angle_deg: 1.0
monitor_joint_error_rad: 0.03
monitor_period_s: 0.1
motion_timeout_s: 120.0
