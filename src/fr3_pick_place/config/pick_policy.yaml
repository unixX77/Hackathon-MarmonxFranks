# All retries are bounded. This file is only for pick.py.
ik_attempts: 8
max_candidates: 4
corrections: 2
descent_retries: 1

# Nominal URDF-based posture/path filters; these do not reproduce Desk's
# singularity criterion. Validate thresholds in simulation/preview first.
joint_margin_rad: 0.03
min_sigma: 0.025
jacobian_length_m: 0.3  # scales translational Jacobian rows before SVD
max_joint_travel_rad: 2.5  # accumulated travel of any single joint, per path

# Correction permitted only above the brick, within these requested-pose errors.
# Existing task.yaml endpoint tolerances and 0.01 rad joint check still apply.
correction_xyz_m: 0.005
correction_angle_deg: 1.0

# Observational execution watchdogs. These are not a real-time safety layer.
monitor_xy_m: 0.003
monitor_angle_deg: 1.0
monitor_joint_error_rad: 0.03
monitor_period_s: 0.1
motion_timeout_s: 120.0
